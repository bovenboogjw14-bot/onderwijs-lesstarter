<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://gamma.app https://*.gamma.app; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Lesstarter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="selectorView" class="panel">
      <header>
        <p class="eyebrow">Onderwijs cockpit</p>
        <h1>Les starten</h1>
        <p class="intro">Kies eerst het vak en daarna de les. De broninformatie verschijnt automatisch.</p>
      </header>

      <div class="field">
        <label for="subjectSelect">Welk vak?</label>
        <select id="subjectSelect">
          <option value="">Kies een vak…</option>
        </select>
      </div>

      <div class="field">
        <label for="lessonSelect">Welke les?</label>
        <select id="lessonSelect" disabled>
          <option value="">Kies eerst een vak…</option>
        </select>
      </div>

      <section id="sourceCard" class="source-card" hidden>
        <h2>Bron voor deze les</h2>
        <div id="sourceRanges"></div>
      </section>

      <p id="status" class="status" role="status"></p>
      <button id="startButton" class="primary" type="button" disabled>Start les</button>
    </section>

    <section id="messageView" class="panel" hidden>
      <p class="eyebrow">Les nog niet gekozen</p>
      <h1 id="messageText">Kies vak en les op dia 1.</h1>
    </section>

    <section id="lessonView" class="lesson-view" hidden>
      <div class="lesson-toolbar">
        <button id="backButton" class="secondary" type="button">← Terug naar leskeuze</button>
        <div class="lesson-identity">
          <strong id="activeLessonTitle"></strong>
          <span id="activeSubjectTitle"></span>
        </div>
        <label id="drawingSelectorWrap" class="drawing-selector" for="drawingSelect" hidden>
          <span>Welke tekening?</span>
          <select id="drawingSelect"></select>
        </label>
      </div>
      <iframe id="lessonFrame" title="Lesinhoud" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </section>

    <section id="closeoutView" class="closeout-view" hidden>
      <header class="closeout-header">
        <p class="eyebrow">Afsluiting</p>
        <h1 id="closeoutTitle">Les afsluiten</h1>
        <div class="closeout-identity">
          <strong id="closeoutLessonTitle"></strong>
          <span id="closeoutSubjectTitle"></span>
        </div>
      </header>
      <div id="closeoutBlocks" class="closeout-grid"></div>
      <p id="closeoutFooter" class="closeout-footer" hidden></p>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
